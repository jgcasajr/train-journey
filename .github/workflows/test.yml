name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # run by hand on any branch (e.g. to check a fix before merging)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # The browser smoke test drives Chromium through Playwright here (installed only for CI;
      # the project itself has no dependencies). Headless Chrome's --dump-dom stalls on CI machines.
      - run: npm install --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          DEBUG: pw:browser
