name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: browser-actions/setup-chrome@v2
        id: browser
      - run: npm run test:browser
        env:
          CHROME_BIN: ${{ steps.browser.outputs.chrome-path }}
