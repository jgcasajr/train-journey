<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Train Journey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene" aria-label="Vista da janela de um trem em movimento"></canvas>

  <div class="board" aria-hidden="true">
    <span id="hud-km">km 0.0</span><span class="sep">•</span>
    <span id="hud-biome">—</span><span class="sep">•</span>
    <span id="hud-speed">0 km/h</span>
    <span class="sep station-part">•</span><span id="hud-station" class="station-part"></span>
  </div>

  <aside id="panel" class="panel">
    <h1>Train Journey</h1>
    <label class="field">
      <span>Velocidade <output id="speed-out">90 km/h</output></span>
      <input type="range" id="speed" min="0" max="220" value="90">
    </label>
    <label class="field">
      <span>Hora do dia <output id="time-out">07:40</output></span>
      <input type="range" id="time" min="0" max="0.999" step="0.001" value="0.32">
    </label>
    <label class="check"><input type="checkbox" id="auto-day" checked> Ciclo automático do dia</label>
    <label class="field">
      <span>Clima <output id="weather-out"></output></span>
      <select id="weather">
        <option value="auto">Automático</option>
        <option value="clear" selected>Limpo</option>
        <option value="rain">Chuva</option>
        <option value="storm">Tempestade</option>
      </select>
    </label>
    <label class="field">
      <span>Estação do ano <output id="season-out"></output></span>
      <select id="season">
        <option value="auto">Automática</option>
        <option value="spring">Primavera</option>
        <option value="summer" selected>Verão</option>
        <option value="autumn">Outono</option>
        <option value="winter">Inverno</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="stops" checked> Parar nas estações</label>
    <button id="sound" type="button" aria-pressed="false">Ativar som</button>
    <div class="buttons">
      <button id="relax" type="button" aria-pressed="false" title="Tela cheia, sem painel, com música ambiente">Relaxar</button>
      <button id="pomodoro" type="button" aria-pressed="false" title="Timer de foco 25 min / pausa 5 min">Pomodoro</button>
      <button id="map-btn" type="button" aria-pressed="false">Mapa</button>
      <button id="photo" type="button">Foto</button>
    </div>
    <p class="hint">Mova o mouse para olhar ao redor. Com o vidro embaçado, arraste para desenhar. H ou toque na cena oculta o painel.</p>
  </aside>

  <div id="pomo-pill" class="pill hidden" role="timer" aria-live="off"></div>

  <section id="line-map" class="line-map hidden" aria-label="Mapa da linha">
    <header><strong>Mapa da linha</strong><span id="map-lap"></span></header>
    <svg id="map-svg" viewBox="0 -40 1000 140" preserveAspectRatio="xMidYMid meet"></svg>
    <footer><span class="key station">Estação</span><span class="key tunnel">Túnel</span><span class="key bridge">Ponte</span><span class="key crossing">Passagem de nível</span></footer>
  </section>

  <div id="photo-flash" class="photo-flash" aria-hidden="true"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
